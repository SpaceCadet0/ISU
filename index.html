<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>I See You — Uprooted, 2026</title>
  <!-- Пути относительные, без ведущего слэша: сайт лежит не в корне домена,
       а в /ISU/, и «/favicon-32x32.png» указывал бы мимо проекта. -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">

  <style>
    /* сама гарнитура приходит таблицей стилей Google Fonts выше;
       собственный @font-face здесь не нужен — без src он всё равно недействителен */

    :root {
      --bg: #F7FBFF;
      --navy: #1D2A57;
      --red: #FC2234;
      --orange: #de9143;
      /* выключенный звук: приглушённый, но с контрастом 3:1 к фону —
         ниже него кнопку уже трудно заметить, а включить звук больше нечем */
      --pale: #8792A2;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --display: "Dela Gothic One", Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg)
    }

    body {
      font-family: var(--mono);
      color: var(--navy);
      -webkit-font-smoothing: antialiased;
    }

    canvas#stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    canvas#stage.dragging {
      cursor: grabbing
    }

    canvas#stage.over-sleeve {
      cursor: pointer
    }

    body.viewing canvas#stage {
      cursor: default
    }

    .mono {
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 11px;
      line-height: 1.7;
    }

    /* ---------- шапка ---------- */

    /* ---------- вступление: полка ---------- */

    :root {
      /* доля ширины окна под саму мебель */
      --shelf-w: 50;
      /* доля непрозрачного содержимого в картинке: по краям у неё прозрачные поля,
         и без поправки мебель вышла бы мельче заказанного */
      --shelf-fill: 0.812;
      /* прозрачный запас снизу — на него картинку опускаем, чтобы ножки встали на край окна */
      --shelf-foot: 0%;
    }

    @media (orientation:portrait) {
      :root {
        --shelf-w: 85
      }
    }

    .shelf {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: calc(var(--shelf-w) * 1% / var(--shelf-fill));
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      opacity: 0;
      transform: translate(-50%, 22px);
      transition: opacity .9s ease, transform .9s cubic-bezier(.2, .7, .3, 1);
    }

    .shelf img {
      display: block;
      width: 100%;
      transform: translateY(var(--shelf-foot));
      pointer-events: none;
    }

    body.ready .shelf {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    /* уход полки быстрее прихода: она освобождает кадр под веер */
    body.entering .shelf {
      opacity: 0;
      transform: translate(-50%, 26px);
      transition-duration: .55s;
      pointer-events: none
    }

    .shelf:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 8px;
      border-radius: 4px
    }

    header {
      opacity: 0;
      transition: opacity .9s ease;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      /* межколоночный зазор нужен, межстрочный — нет: «собачка» стоит второй
         строкой сетки, и общий gap отбивал бы её от подписи на все 24px */
      column-gap: 24px;
      row-gap: 0;
      padding: 26px 32px;
      pointer-events: none;
    }

    header>* {
      pointer-events: auto
    }

    .h-note {
      max-width: 22ch
    }

    /* подпись справа — внешняя ссылка, ведёт себя кнопкой:
       палец на курсоре, отклик на наведение, своё кольцо фокуса */
    .h-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* «собачка» под подписью, по правому краю шапки */
    .h-at,
    .card-at {
      font-family: var(--mono);
      font-size: 17px;
      line-height: 1;
      color: var(--navy);
      text-decoration: none;
      transition: color .18s ease;
    }

    .h-at:hover,
    .card-at:hover {
      color: var(--red)
    }

    .h-at:focus-visible,
    .card-at:focus-visible {
      color: var(--red);
      outline: 2px solid var(--red);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .h-at {
      grid-column: 3;
      justify-self: end;
      margin-top: 2px;
    }

    /* в карточке «собачка» появляется только на узком экране — там, где
       шапочная подпись скрыта; на широком её роль играет шапочная */
    .card-foot {
      display: contents
    }

    .card-at {
      display: none
    }

    .h-sound {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--navy);
      cursor: pointer;
      transition: opacity .18s ease, color .18s ease;
    }

    /* звук выключен — кнопка бледнеет */
    .h-sound[aria-pressed="true"] {
      color: var(--pale)
    }

    .h-sound svg {
      width: 18px;
      height: 16px;
      display: block;
    }

    .h-sound .s-body {
      fill: currentColor
    }

    .h-sound .s-wave,
    .h-sound .s-off {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .h-sound .s-off {
      display: none
    }

    /* нажатая кнопка = звук выключен: волны прячем, крестик показываем */
    .h-sound[aria-pressed="true"] .s-wave {
      display: none
    }

    .h-sound[aria-pressed="true"] .s-off {
      display: block
    }

    .h-sound:hover {
      opacity: .7
    }

    .h-sound:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
      border-radius: 3px;
    }

    .h-sign {
      text-align: right;
      max-width: 22ch;
      color: var(--navy);
      text-decoration: none;
      cursor: pointer;
      transition: color .18s ease;
    }

    .h-sign:hover {
      color: var(--red);
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
    }

    .h-sign:focus-visible {
      color: var(--red);
      outline: 2px solid var(--red);
      outline-offset: 5px;
    }

    .logo {
      width: 200px;
      height: 20px;
      background-image: url('logo.svg');
      background-size: contain;
      background-repeat: no-repeat;
      color: var(--red);
    }

    .brand {
      font-family: var(--display);
      text-transform: uppercase;
      font-size: 30px;
      line-height: 1;
      color: var(--navy);
      letter-spacing: .005em;
      white-space: nowrap;
      padding-top: 2px;
    }

    /* ---------- точки ---------- */

    nav.dots {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      align-items: center;
      transition: opacity .35s ease, visibility .35s;
    }

    body.ready header {
      opacity: 1
    }

    /* пока показана полка, пластинок нет — и точек, которые их считают, тоже */
    body.intro nav.dots,
    body.viewing nav.dots {
      opacity: 0;
      visibility: hidden;
      pointer-events: none
    }

    nav.dots a {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      text-decoration: none;
      outline: none;
    }

    nav.dots a::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--navy);
      opacity: .32;
      transition: opacity .2s ease, background-color .2s ease;
    }

    nav.dots a:hover::after {
      opacity: .7
    }

    nav.dots a[aria-current="true"] {
      box-shadow: inset 0 0 0 1px var(--navy)
    }

    nav.dots a[aria-current="true"]::after {
      opacity: 1;
      background: var(--navy)
    }

    nav.dots a:focus-visible {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--red)
    }

    /* ---------- карточка ---------- */

    /* Закрытая карточка не просто прозрачна, а выключена целиком: прозрачный блок
       продолжал бы ловить колесо и клики поверх веера, а его стрелка возврата и
       блок текста — оставаться в обходе по Tab. visibility переключается в конце
       затухания, поэтому уход карточки по-прежнему видно. */
    .card {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease, visibility 0s linear .3s;
    }

    body.viewing .card {
      opacity: 1;
      visibility: visible;
      transition: opacity .3s ease, visibility 0s
    }

    .card>* {
      pointer-events: auto
    }

    .card:focus {
      outline: none
    }

    .card-cols {
      position: absolute;
      left: 40%;
      right: 6%;
      top: 33%;
      bottom: 6%;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: 44px;
      transform: translateY(14px);
      transition: transform .45s cubic-bezier(.2, .7, .3, 1), opacity .45s ease;
      opacity: 0;
    }

    body.viewing .card-cols {
      transform: none;
      opacity: 1
    }

    /* Колонка ограничена кадром, а внутри — флекс: заголовок, артист и стрелка
       занимают своё, а длинный текст ужимается и прокручивается. Так стрелка
       возврата остаётся в кадре при любой длине описания и любом переносе
       заголовка — потолок в долях экрана этого не гарантировал. */
    .card-cols>div {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .r-title {
      font-family: var(--display);
      /* у Dela Gothic One одно начертание: 800 дал бы синтетический жир,
         который гарнитура рисует грубее собственного */
      font-weight: 400;
      /* Заметно ниже марки в шапке: у неё 30px, здесь 22px на широком экране.
         Капс той же гарнитурой набирает ширину и зрительно крупнее строчных,
         поэтому равный кегль читался бы как более крупный. */
      text-transform: uppercase;
      font-size: clamp(17px, 1.55vw, 22px);
      line-height: 1.16;
      letter-spacing: 0;
      color: var(--navy);
      text-wrap: balance;
    }

    .r-artist {
      margin-top: 14px
    }

    .r-desc {
      margin-top: 18px;
      /* почти во всю колонку: 55ch — это ~48 знаков в строке с учётом разрядки,
         то есть комфортная длина строки, и на очень широком мониторе описание
         не растягивается вслед за колонкой */
      max-width: 55ch;
      /* растёт по содержимому, но ужимается и прокручивается, когда места нет */
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      text-transform: none;
      letter-spacing: .02em;
      line-height: 1.85
    }

    .r-desc::-webkit-scrollbar {
      width: 2px
    }

    .r-desc::-webkit-scrollbar-thumb {
      background: var(--navy);
      opacity: .3
    }

    .back {
      align-self: flex-start;
      flex: 0 0 auto;
      margin-top: 36px;
      font-size: 26px;
      line-height: 1;
      color: var(--navy);
      text-decoration: none;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 6px 10px 6px 0;
      font-family: var(--mono);
    }

    .back:hover {
      color: var(--red)
    }

    .back:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px
    }

    /* длинный текст: описание или слова песни.
       pre-line — перевод строки виден, пустая строка разбивает на строфы */
    .lyrics {
      white-space: pre-line;
      text-transform: none;
      letter-spacing: .02em;
      line-height: 2;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 16px;
    }

    /* На широком экране ссылку держит подпись в шапке, здесь она не нужна.
       Показывается ровно по тому же порогу, по которому шапочная прячется, —
       иначе в узком горизонтальном окне не осталось бы ни одной. */
    .card-listen {
      display: none
    }

    .lyrics::-webkit-scrollbar {
      width: 2px
    }

    .lyrics::-webkit-scrollbar-thumb {
      background: var(--navy);
      opacity: .3
    }

    /* ---------- узкий экран ---------- */

    @media (max-width:900px) {
      header {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 20px
      }

      .h-note,
      .h-sign {
        display: none
      }

      .h-at {
        display: none
      }

      /* Listen слева, «собачка» справа — по нижнему краю, чтобы знак встал
         на строку подписи, а не на черту над ней */
      .card-foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }

      .card-at {
        display: block;
        padding-bottom: 2px;
      }

      /* Шапка на узком экране схлопывается до одной марки, и лишний ряд в ней
         сдвинул бы крупный план вниз. Поэтому кнопка звука уходит из потока
         шапки в нижний правый угол.

         Отступ снизу подогнан под точки: они стоят на 20px от края при высоте
         16px, то есть их центр — на 28px. Кнопка высотой 26px даёт тот же центр
         при отступе 15px. Держи эти числа парой: сдвинешь точки — уедет и она. */
      .h-right {
        position: fixed;
        left: auto;
        right: 18px;
        bottom: 15px;
        gap: 0;
        transition: opacity .35s ease, visibility .35s;
      }

      /* появляется вместе с точками: на первом экране её нет, и в карточке —
         тоже, иначе повисла бы поверх шторки с текстом */
      body.intro .h-right,
      body.viewing .h-right {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .brand {
        font-size: 30px
      }

      nav.dots {
        gap: 8px;
        bottom: 20px
      }

      nav.dots a {
        width: 16px;
        height: 16px
      }

      .card-cols>div {
        display: block;
        min-height: auto
      }

      .card-cols {
        left: 0;
        right: 0;
        top: auto;
        bottom: 0;
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 22px 22px calc(22px + env(safe-area-inset-bottom));
        background: var(--bg);
        box-shadow: 0 -24px 30px 10px var(--bg);
        max-height: 50vh;
        overflow-y: auto;
      }

      /* самый низ шторки: короткая черта, под ней ссылка */
      .card-listen {
        display: block;
        position: relative;
        margin-top: 26px;
        padding-top: 18px;
        color: var(--navy);
        text-decoration: none;
        cursor: pointer;
        transition: color .18s ease;
      }

      .card-listen::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 44px;
        height: 1px;
        background: var(--navy)
      }

      .card-listen:hover {
        color: var(--red);
        text-decoration: underline;
        text-underline-offset: 5px;
        text-decoration-thickness: 1px
      }

      .card-listen:focus-visible {
        color: var(--red);
        outline: 2px solid var(--red);
        outline-offset: 4px;
        text-decoration: none
      }

      .r-title {
        font-size: 17px
      }

      .r-desc {
        max-width: none;
        max-height: none;
        overflow: visible;
        margin-top: 14px
      }

      .r-artist {
        margin-top: 10px
      }

      .back {
        margin-top: 18px
      }

      /* внутри шторки прокрутка одна — своей у текста быть не должно */
      .lyrics {
        max-height: none;
        overflow: visible;
        padding-right: 0;
        line-height: 1.9
      }
    }

    /* ---------- обложка во весь экран ---------- */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      /* тот же #F7FBFF, но полупрозрачный: сцена за ним размывается, а не гаснет */
      background: rgba(247, 251, 255, .62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity .35s ease;
      cursor: zoom-out;
    }

    .lightbox.on {
      opacity: 1
    }

    .lightbox img {
      position: fixed;
      display: block;
      /* растём от левого верхнего угла: так перенос в миниатюру считается
         одним translate + scale, без поправок на центр */
      transform-origin: top left;
      will-change: transform;
      cursor: default;
      box-shadow: 0 40px 90px rgba(29, 42, 87, .22);
    }

    body.viewing canvas#stage.over-cover {
      cursor: zoom-in
    }

    /* ---------- запасная сетка ---------- */

    .fallback {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--bg);
      overflow: auto;
      padding: 32px;
      display: none
    }

    .fallback.on {
      display: block
    }

    .fallback p {
      max-width: 60ch;
      margin-bottom: 26px;
      line-height: 1.8
    }

    .fallback code {
      font-family: var(--mono);
      color: var(--red)
    }

    .fb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 22px
    }

    .fb-grid figure img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #D4E0EA
    }

    .fb-grid figcaption {
      margin-top: 10px
    }

    /* ---------- служебное ---------- */

    .vh {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        transition-duration: 1ms !important
      }
    }
  </style>
</head>

<body class="intro">

  <canvas id="stage" aria-hidden="true"></canvas>

  <header>
    <div class="h-note mono" id="h-note"></div>
    <div class="brand" id="h-brand"></div>
    <div class="h-right">
      <button class="h-sound" id="h-sound" aria-pressed="false" aria-label="Turn sound off">
        <svg viewBox="0 0 18 16" aria-hidden="true" focusable="false">
          <path class="s-body" d="M3 6h2.6L9.4 2.6v10.8L5.6 10H3z" />
          <path class="s-wave" d="M12 5.6a3.7 3.7 0 0 1 0 4.8M14.2 3.6a6.5 6.5 0 0 1 0 8.8" />
          <path class="s-off" d="M12.2 5.8l4 4.4M16.2 5.8l-4 4.4" />
        </svg>
      </button>
      <a class="h-sign mono" id="h-sign" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <a class="h-at" href="https://taplink.cc/iseeyouband" target="_blank" rel="noopener noreferrer"
      aria-label="All links">@</a>
  </header>

  <button class="shelf" id="shelf" aria-label="Open the collection">
    <img src="shelf-bg.png" alt="A turntable and a shelf of records" decoding="async">
  </button>

  <nav class="dots" id="dots" aria-label="Releases"></nav>

  <div class="card" id="card" role="dialog" aria-modal="true" aria-label="Release" tabindex="-1" aria-hidden="true">
    <div class="card-cols">
      <div>

    /* Отступы внутри шаблонного литерала попадают в сам текст: строки песни уезжают
       вправо на ширину отступа кода. Снимаем общий отступ, чтобы литерал можно было
       держать вровень с кодом, а на экран текст выходил прижатым к левому краю. */
    const dedent = t => {
      const lines = t.replace(/^\n/, '').replace(/\s+$/, '').split('\n')
      /* первая строка стоит сразу за кавычкой и отступа не несёт — общий отступ
         считается по продолжениям, иначе он всегда выходит нулевым */
      const rest = lines.slice(1).filter(l => l.trim())
      if (!rest.length) return lines[0]
      const pad = Math.min(...rest.map(l => l.match(/^ */)[0].length))
      return [lines[0], ...lines.slice(1).map(l => l.slice(pad))].join('\n')
    }

      const w = innerWidth, h = innerHeight
      aspect = w / h
      narrow = w < 900
      targetY = narrow ? 2 : -1
      const FILL = narrow ? 0.46 : 0.58
      camZ = SLEEVE / (2 * TAN * FILL) + SLEEVE / 2
    }
    readViewport()

    /* положение крупного плана */
    function cardPlacement() {
      /* на узком экране под обложку уходит меньше: композиция «конверт + пластинка» целиком
         встаёт над шторкой текста и не заезжает под неё */
      const CARD_FILL = narrow ? 0.245 : 0.47
      const dist = SLEEVE / (2 * TAN * CARD_FILL)
      const halfW = TAN * dist * aspect
      const halfH = TAN * dist
      if (narrow) {
        return { dist, x: 0, y: targetY + halfH * 0.44 - REC_R / 2 }
      }
      return {
        dist,
        x: -halfW + halfW * 2 * 0.07 + SLEEVE / 2,
        y: targetY - REC_R / 2,
      }
    }

          const img = tex.image
          const a = img.width / img.height
          if (a > 1) { tex.repeat.set(1 / a, 1); tex.offset.set((1 - 1 / a) / 2, 0) }
          else { tex.repeat.set(1, a); tex.offset.set(0, (1 - a) / 2) }
          tex.colorSpace = THREE.SRGBColorSpace
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy()
          tex.generateMipmaps = true
          tex.minFilter = THREE.LinearMipmapLinearFilter
          covers[n] = tex
          coversLoaded++
          invalidateAll()
        },
        undefined,
        () => { coversFailed++; if (coversFailed === N) showFallback('covers') }
      )
    }

    /* ---------- текстуры торцов и пластинок ---------- */

    const SPINE_FILL = 0.86      // доля торца под прописные, остаток — воздух до фальцев

    function spineTexture(rel, paper, ink) {
      const W = 64
      const H = Math.round(W * (SLEEVE - THICK) / THICK)   // пропорции самой грани торца
      const c = document.createElement('canvas')
      c.width = W; c.height = H
      const g = c.getContext('2d')

      /* фон запекается в текстуру: прозрачность здесь дала бы чёрный торец */
      g.fillStyle = paper
      g.fillRect(0, 0, W, H)

      const line = `${rel.artist}  —  ${rel.title}`.toUpperCase()
      const face = px => `600 ${px}px ui-monospace, Menlo, monospace`

      /* кегль подбирается по фактической высоте прописных: подпись ровно в ширину торца,
         а толщина торца задана этой высотой — потому меряем, а не подставляем число */
      g.textBaseline = 'alphabetic'
      if ('letterSpacing' in g) g.letterSpacing = '3px'
      g.font = face(100)
      const probe = g.measureText(line)
      const vis = probe.actualBoundingBoxAscent + probe.actualBoundingBoxDescent
      g.font = face(100 * (W * SPINE_FILL) / vis)

      const m = g.measureText(line)
      const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent

      g.save()
      g.translate(W / 2, H * 0.66)
      g.rotate(-Math.PI / 2)
      g.fillStyle = ink
      g.textAlign = 'left'
      g.fillText(line, 0, (a - d) / 2)
      g.restore()

      /* Износ торца: замятости поперёк и царапины вдоль. Рисуются поверх подписи —
         потёртость на настоящем конверте лежит поверх краски, а не под ней.
         Ручки: сколько отметин и насколько они видны. Учти, что торец на экране
         около полутора десятков пикселей в ширину: волосок в один пиксель текстуры
         усредняется мипмапом почти в ничто, поэтому линии заметно толще, чем кажется
         разумным при взгляде на канвас. */
      const WEAR = { creases: 6, scratches: 20, alpha: 2 }

      g.lineCap = 'round'

      for (let i = 0; i < WEAR.creases; i++) {
        const y = H * (0.05 + Math.random() * 0.9)
        const lean = (Math.random() - 0.5) * 30
        g.strokeStyle = `rgba(228,230,234,${(0.22 + Math.random() * 0.16) * WEAR.alpha})`
        g.lineWidth = 2.4 + Math.random() * 2.6
        g.beginPath()
        g.moveTo(-1, y)
        g.quadraticCurveTo(W / 2, y + lean * 0.35, W + 1, y + lean)
        g.stroke()
      }

      for (let i = 0; i < WEAR.scratches; i++) {
        const x = 3 + Math.random() * (W - 6)
        const y = Math.random() * H
        const len = H * (0.008 + Math.random() * 0.045)
        g.strokeStyle = `rgba(234,236,240,${(0.16 + Math.random() * 0.14) * WEAR.alpha})`
        g.lineWidth = 1.5 + Math.random() * 1.4
        g.beginPath()
        g.moveTo(x, y)
        g.lineTo(x + (Math.random() - 0.5) * 6, y + len)
        g.stroke()
      }

      const t = new THREE.CanvasTexture(c)
      t.colorSpace = THREE.SRGBColorSpace
      t.anisotropy = renderer.capabilities.getMaxAnisotropy()
      return t
    }

    function recordTexture(disc) {
      const S = 1024
      const c = document.createElement('canvas')
      c.width = S; c.height = S
      const g = c.getContext('2d')
      const R = S / 2

      const LABEL_R = R * 0.36        // этикетка
      const LAND_IN = R * 0.40        // гладкое поле от этикетки до дорожек
      const GROOVE_IN = R * 0.44      // начало нарезки
      const GROOVE_OUT = R * 0.955    // конец нарезки
      const RIM = R * 0.985           // гладкий заход у края

      const ring = (r, from = 0, to = Math.PI * 2) => {
        g.beginPath(); g.arc(R, R, r, from, to)
      }

      /* Блик винила анизотропный: свет бежит вдоль дорожек и собирается в две
         противоположные дуги, а не растекается равномерно. Отсюда конический
         градиент с двумя долями — на глаз это и читается как «пластинка». */
      const GLOSS = 0.8               // общая яркость блика: одна ручка на все слои

      const sheen = a0 => {
        const a = a0 * GLOSS
        if (g.createConicGradient) {
          const grad = g.createConicGradient(-Math.PI / 4, R, R)
          const lobes = [
            [0.00, 1.00], [0.05, 0.55], [0.13, 0.10], [0.30, 0.02], [0.42, 0.22],
            [0.50, 0.95], [0.58, 0.22], [0.70, 0.02], [0.87, 0.10], [0.95, 0.55], [1.00, 1.00],
          ]
          for (const [p, k] of lobes) grad.addColorStop(p, `rgba(255,255,255,${(k * a).toFixed(4)})`)
          return grad
        }
        /* запасной вариант: одна диагональ вместо двух дуг */
        const grad = g.createLinearGradient(0, S, S, 0)
        grad.addColorStop(0, `rgba(255,255,255,${a})`)
        grad.addColorStop(0.55, 'rgba(255,255,255,0)')
        grad.addColorStop(1, `rgba(255,255,255,${a * 0.8})`)
        return grad
      }

      g.clearRect(0, 0, S, S)

      /* основа */
      g.fillStyle = disc
      ring(R); g.fill()

      /* общий блик по всему диску, слабый */
      g.fillStyle = sheen(0.10)
      ring(R); g.fill()

      /* гладкие поля — заход у края и площадка перед этикеткой — блестят сильнее
         нарезанной части: там поверхность зеркальная */
      g.save()
      g.beginPath(); g.arc(R, R, R, 0, Math.PI * 2); g.arc(R, R, RIM, 0, Math.PI * 2, true)
      g.clip('evenodd')
      g.fillStyle = sheen(0.42); g.fillRect(0, 0, S, S)
      g.restore()

      g.save()
      g.beginPath(); g.arc(R, R, GROOVE_IN, 0, Math.PI * 2); g.arc(R, R, LAND_IN, 0, Math.PI * 2, true)
      g.clip('evenodd')
      g.fillStyle = sheen(0.30); g.fillRect(0, 0, S, S)
      g.restore()

      /* дорожки: только светлые волоски. Тёмные промежутки рисовать не надо —
         при уменьшении они усредняются со светлыми в серую кашу */
      g.strokeStyle = sheen(0.30)
      g.lineWidth = 1
      for (let r = GROOVE_IN; r < GROOVE_OUT; r += 3) { ring(r); g.stroke() }

      /* редкие разделители между зонами записи */
      g.strokeStyle = sheen(0.55)
      g.lineWidth = 1.6
      for (const k of [0.52, 0.63, 0.74, 0.86]) { ring(R * k); g.stroke() }

      /* кромка ловит свет ярче всего */
      g.strokeStyle = sheen(0.85)
      g.lineWidth = 2.5
      ring(R - 1.5); g.stroke()

      /* и тут же уходит в тень — иначе край выглядит наклейкой */
      const edge = g.createRadialGradient(R, R, R * 0.93, R, R, R)
      edge.addColorStop(0, 'rgba(0,0,0,0)')
      edge.addColorStop(1, 'rgba(0,0,0,.45)')
      g.fillStyle = edge
      ring(R); g.fill()

      /* этикетка светлая */
      g.fillStyle = BG
      ring(LABEL_R); g.fill()

      g.strokeStyle = 'rgba(0,0,0,.06)'
      g.lineWidth = 1
      for (const k of [0.42, 0.60, 0.78]) { ring(LABEL_R * k); g.stroke() }

      /* винил чуть набегает на край этикетки */
      const lip = g.createRadialGradient(R, R, LABEL_R * 0.88, R, R, LABEL_R)
      lip.addColorStop(0, 'rgba(0,0,0,0)')
      lip.addColorStop(1, 'rgba(0,0,0,.16)')
      g.fillStyle = lip
      ring(LABEL_R); g.fill()

      /* отверстие под шпиндель — чёрное, иначе на светлой этикетке его не видно.
         Центр диска стоит на кромке конверта, поэтому в кадре оно читается полукругом */
      g.fillStyle = '#000000'
      ring(R * 0.035); g.fill()

      const tex = new THREE.CanvasTexture(c)
      tex.colorSpace = THREE.SRGBColorSpace
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy()
      return tex
    }

    /* тёмно-синий по светлому, светлый по тёмному — на торце это единственный текст */
    const spineTex = RELEASES.map((r, i) => {
      const paper = sleeveColor(i)
      const ink = spineInk(i)
      return spineTexture(r, paper, ink)
    })
    /* этикетка больше не зависит от релиза — на каждый цвет диска хватает одной текстуры */
    const discTex = new Map()
    const recordTex = RELEASES.map((r, i) => {
      const c = RECORD_COLORS[i % 4]
      if (!discTex.has(c)) discTex.set(c, recordTexture(c))
      return discTex.get(c)
    })

    /* ---------- сборка конверта ---------- */
    /* грани BoxGeometry: [+x, -x, +y, -y, +z, -z]
       ±x — торец (смотрит в камеру, конверт развёрнут на 86°)
       ±z — плоские грани, обложка кладётся на обе                       */

    function makeSleeve() {
      const mats = [
        new THREE.MeshLambertMaterial(),                 // +x торец
        new THREE.MeshLambertMaterial(),                 // -x торец
        new THREE.MeshLambertMaterial(),                 // +y
        new THREE.MeshLambertMaterial(),                 // -y
        new THREE.MeshBasicMaterial(),                   // +z обложка
        new THREE.MeshBasicMaterial(),                   // -z обложка
      ]
      const mesh = new THREE.Mesh(sleeveGeo, mats)

      /* фальцы сидят на материале кромки: dressSleeve красит mats[2], они следуют за ним */
      const foldTop = new THREE.Mesh(foldGeo, mats[2])
      const foldBot = new THREE.Mesh(foldGeo, mats[2])
      foldTop.position.y = (SLEEVE - THICK) / 2
      foldBot.position.y = -(SLEEVE - THICK) / 2
      mesh.add(foldTop, foldBot)

      const record = new THREE.Mesh(recordGeo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }))
      record.position.set(0, 0, 0)
      mesh.add(record)

      return { mesh, mats, record }
    }

    /* конверт n-го релиза */
    function dressSleeve(s, rel) {
      const c = sleeveColor(rel)
      s.mats[0].map = s.mats[1].map = spineTex[rel]
      s.mats[0].color.set('#ffffff'); s.mats[1].color.set('#ffffff')
      s.mats[2].color.set(c); s.mats[3].color.set(c)

      const tex = covers[rel]
      s.mats[4].map = s.mats[5].map = tex || null
      s.mats[4].color.set(tex ? '#ffffff' : c)
      s.mats[5].color.set(tex ? '#ffffff' : c)
      for (const m of s.mats) m.needsUpdate = true

      s.record.material.map = recordTex[rel]
      s.record.material.color.set('#ffffff')
      s.record.material.needsUpdate = true
    }

    /* ---------- слоты ---------- */

    const slots = []
    for (let i = 0; i < SLOTS; i++) {
      const group = new THREE.Group()
      const turn = new THREE.Group()
      const s = makeSleeve()
      const proxy = new THREE.Mesh(proxyGeo, proxyMat)

      proxy.position.y = LIFT / 2
      turn.add(s.mesh, proxy)
      group.add(turn)
      fanRoot.add(group)

      proxy.userData.slot = i
      slots.push({ i, group, turn, sleeve: s, proxy, release: -1, lift: 0, hover: false })
    }

    function invalidateAll() { for (const sl of slots) { sl.release = -1 } if (hero.release >= 0) { dressSleeve(hero.s, hero.release) } }

    /* ---------- герой крупного плана ---------- */

    const hero = { s: makeSleeve(), release: -1, recOut: 0 }
    hero.s.mesh.visible = false
    scene.add(hero.s.mesh)

    /* ============================================================
       состояние
       ============================================================ */

    let scrollTarget = 0
    let scroll = 0
    let active = 0

    let mode = 'intro'               // intro | entering | fan | opening | card | closing
    let t0 = 0
    let cardT = 0                    // 0 — веер, 1 — карточка
    const FLY = reduced ? 1 : 700
    const ENTER = reduced ? 1 : 1100        // веер выезжает из ячейки
    const ENTER_SEED = 0.05                 // с какого масштаба начинает

    /* смещение и масштаб веера на время вступления */
    let introK = ENTER_SEED
    let introX = 0, introY = 0
    const slotWorld = { x: 0, y: 0 }
    const REC_DELAY = reduced ? 0 : 280
    const REC_TIME = reduced ? 1 : 520

    const heroFrom = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() }
    const heroTo = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() }

    const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
    const easeOut = t => 1 - Math.pow(1 - t, 3)

    /* ============================================================
       раскладка
       ============================================================ */

    function layout(dt) {
      const tau = reduced ? 0 : 0.09
      if (tau === 0) scroll = scrollTarget
      else scroll += (scrollTarget - scroll) * (1 - Math.exp(-dt / tau))

      const k = Math.round(scroll)
      const frac = scroll - k

      const nextActive = ((k % N) + N) % N
      if (nextActive !== active) { active = nextActive; announce() }

      for (const sl of slots) {
        const ang = (sl.i - CENTER - frac) * STEP
        const x = ARC_R * Math.sin(ang)
        const y = PIVOT_Y + ARC_R * Math.cos(ang)

        sl.group.position.set(x, y, 0)
        sl.group.rotation.z = -ang
        sl.turn.rotation.y = TURN - Math.atan2(x, camZ)

        /* содержимое слота — целая часть прокрутки */
        const rel = (((sl.i - CENTER + k) % N) + N) % N
        if (rel !== sl.release) { sl.release = rel; dressSleeve(sl.sleeve, rel) }

        /* выдвижение по ховеру — отдельной величиной, без пружины раскладки */
        const want = sl.hover && mode === 'fan' ? LIFT : 0
        sl.lift += (want - sl.lift) * (reduced ? 1 : 1 - Math.exp(-dt / 0.07))
        sl.sleeve.mesh.position.y = sl.lift
      }
    }

    /* ============================================================
       камера и переход в карточку
       ============================================================ */

    function applyCamera() {
      const p = cardPlacement()
      const z = camZ + (p.dist - camZ) * easeInOut(cardT)
      camera.position.set(0, targetY, z)
      camera.lookAt(0, targetY, 0)
      fanRoot.position.set(introX, introY - 140 * easeInOut(cardT), 0)
      fanRoot.scale.setScalar(introK)
    }

    function heroTargets(slotIndex) {
      const sl = slots[slotIndex]

      /* слот читается там, где он будет при закрытой карточке: на возврате веер ещё
         уведён под нижний край, и без этого конверт улетал бы мимо своего места */
      const keep = fanRoot.position.y
      fanRoot.position.y = 0
      fanRoot.updateMatrixWorld(true)
      sl.sleeve.mesh.matrixWorld.decompose(heroFrom.pos, heroFrom.quat, new THREE.Vector3())
      fanRoot.position.y = keep
      fanRoot.updateMatrixWorld(true)

      const p = cardPlacement()
      heroTo.pos.set(p.x, p.y, 0)
      heroTo.quat.identity()
    }

    function applyHero(t) {
      const e = easeInOut(t)
      hero.s.mesh.position.lerpVectors(heroFrom.pos, heroTo.pos, e)
      hero.s.mesh.quaternion.slerpQuaternions(heroFrom.quat, heroTo.quat, e)
      hero.s.record.position.y = hero.recOut * (SLEEVE / 2)
    }

    let openedFrom = -1

    function openCard(slotIndex) {
      if (mode !== 'fan') return
      const rel = slots[slotIndex].release

      openedFrom = slotIndex
      hero.release = rel
      dressSleeve(hero.s, rel)
      hero.s.mesh.visible = true
      hero.recOut = 0
      slots[slotIndex].sleeve.mesh.visible = false
      for (const sl of slots) sl.hover = false

      heroTargets(slotIndex)
      applyHero(0)

      fillCard(rel)
      document.body.classList.add('viewing')
      document.getElementById('card').setAttribute('aria-hidden', 'false')
      canvas.classList.remove('over-sleeve')

      mode = 'opening'; t0 = performance.now()
      if (reduced) { cardT = 1; hero.recOut = 1; applyHero(1); mode = 'card' }
      document.getElementById('card').focus({ preventScroll: true })
    }

    function closeCard() {
      if (mode !== 'card' && mode !== 'opening') return
      heroTargets(openedFrom)
      document.body.classList.remove('viewing')
      document.getElementById('card').setAttribute('aria-hidden', 'true')
      mode = 'closing'; t0 = performance.now()
      if (reduced) { finishClose() }
      const dot = document.querySelector(`nav.dots a[data-i="${active}"]`)
      if (dot) dot.focus({ preventScroll: true })
    }

    function finishClose() {
      cardT = 0
      hero.s.mesh.visible = false
      hero.recOut = 0
      if (openedFrom >= 0) slots[openedFrom].sleeve.mesh.visible = true
      openedFrom = -1
      mode = 'fan'
    }

    /* ============================================================
       кадр
       ============================================================ */

    let last = performance.now()

    /* ============================================================
       обложка во весь экран
       ============================================================ */

    const LB = { open: 0.42, close: 0.34, fill: 0.82 }   // секунды и доля кадра

    const lb = document.getElementById('lightbox')
    const lbImg = document.getElementById('lb-img')
    let lbOn = false

    /* Экранный прямоугольник обложки. Считается проекцией углов самой грани,
       а не по формулам крупного плана: работает при любом его положении,
       размере и на любом кадре анимации. */
    function coverRect() {
      const m = hero.s.mesh
      m.updateWorldMatrix(true, false)
      const v = new THREE.Vector3()
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
        v.set(sx * SLEEVE / 2, sy * SLEEVE / 2, THICK / 2)
          .applyMatrix4(m.matrixWorld).project(camera)
        const px = (v.x * 0.5 + 0.5) * innerWidth
        const py = (0.5 - v.y * 0.5) * innerHeight
        x0 = Math.min(x0, px); x1 = Math.max(x1, px)
        y0 = Math.min(y0, py); y1 = Math.max(y1, py)
      }
      return { left: x0, top: y0, size: Math.min(x1 - x0, y1 - y0) }
    }

    function lbTarget() {
      const size = Math.min(innerWidth, innerHeight) * LB.fill
      return { left: (innerWidth - size) / 2, top: (innerHeight - size) / 2, size }
    }

    function lbPlace() {
      const b = lbTarget()
      lbImg.style.left = b.left + 'px'
      lbImg.style.top = b.top + 'px'
      lbImg.style.width = b.size + 'px'
      lbImg.style.height = b.size + 'px'
    }

    /* перенос из раскрытого положения обратно в миниатюру */
    function lbToCover() {
      const a = coverRect(), b = lbTarget()
      return `translate(${(a.left - b.left).toFixed(2)}px, ${(a.top - b.top).toFixed(2)}px)`
        + ` scale(${(a.size / b.size).toFixed(5)})`
    }

    function openLightbox() {
      if (lbOn || mode !== 'card' || hero.release < 0) return
      lbOn = true

      lbImg.src = `covers/${hero.release + 1}.jpg`
      lbImg.alt = RELEASES[hero.release].title
      lbPlace()

      lb.hidden = false
      lbImg.style.transition = 'none'
      lbImg.style.transform = lbToCover()

      if (reduced) {
        lb.classList.add('on')
        lbImg.style.transform = 'none'
      } else {
        /* два кадра: в первом браузер принимает стартовый transform, во втором
           начинается переход. В одном кадре смена значений схлопнулась бы. */
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (!lbOn) return
          lb.classList.add('on')
          lbImg.style.transition = `transform ${LB.open}s cubic-bezier(.2,.7,.3,1)`
          lbImg.style.transform = 'none'
        }))
      }
      lb.focus({ preventScroll: true })
    }

    function closeLightbox() {
      if (!lbOn) return
      lbOn = false
      lb.classList.remove('on')
      lbImg.style.transition = reduced ? 'none' : `transform ${LB.close}s cubic-bezier(.4,0,.6,1)`
      lbImg.style.transform = lbToCover()
      setTimeout(() => { if (!lbOn) lb.hidden = true }, reduced ? 0 : LB.close * 1000)
      document.getElementById('card').focus({ preventScroll: true })
    }

    /* закрывает клик мимо картинки — по самой картинке ничего не происходит */
    lb.addEventListener('click', ev => { if (ev.target !== lbImg) closeLightbox() })

    /* ============================================================
       звук
       ============================================================ */

    /* Ручки: через сколько после загрузки пробовать, до какой громкости
       и за сколько её набирать. */
    const AUDIO = { delay: 2000, volume: 0.55, fade: 800 }

    /* сам элемент лежит в разметке: так дорожка видна в отладчике и её состояние
       можно проверить, а не только услышать */
    const audio = document.getElementById('track')
    audio.loop = false
    audio.volume = 0

    let soundOff = false
    let armed = false

    /* Нарастание на setInterval, а не на кадрах анимации: в фоновой вкладке
       звук продолжает идти, а requestAnimationFrame останавливается — громкость
       застыла бы на нуле. */
    function fadeIn() {
      const t0 = Date.now()
      const id = setInterval(() => {
        if (soundOff) { clearInterval(id); return }
        const k = Math.min((Date.now() - t0) / AUDIO.fade, 1)
        audio.volume = AUDIO.volume * k
        if (k >= 1) clearInterval(id)
      }, 40)
    }

    /* Первое действие посетителя снимает запрет на звук. Слушаем в фазе
       перехвата, чтобы клик по полке засчитался раньше своего обработчика. */
    function armFirstGesture() {
      if (armed) return
      armed = true
      const events = ['pointerdown', 'keydown', 'touchstart']
      const go = () => {
        for (const e of events) removeEventListener(e, go, true)
        armed = false
        startSound()
      }
      for (const e of events) addEventListener(e, go, true)
    }

    async function startSound() {
      if (soundOff) return
      try {
        await audio.play()
        if (audio.volume === 0) fadeIn()
      } catch {
        /* автозапуск без жеста запрещён почти везде — ждём первого действия */
        armFirstGesture()
      }
    }

    {
      const btn = document.getElementById('h-sound')

      const apply = off => {
        soundOff = off
        btn.setAttribute('aria-pressed', String(off))
        btn.setAttribute('aria-label', off ? 'Turn sound on' : 'Turn sound off')
        if (off) audio.pause()
        else startSound()
      }

      btn.addEventListener('click', () => apply(!soundOff))
      setTimeout(startSound, AUDIO.delay)
    }

    /* ============================================================
       вступление — полка, из которой выезжает веер
       ============================================================ */

    /* пустая ячейка на картинке, в долях её ширины и высоты */
    const SLOT = { x: 0.713, y: 0.474 }

    fanRoot.visible = false

    /* экранная точка -> мир в плоскости z = 0: камера смотрит вдоль оси Z,
       так что достаточно линейного пересчёта через полукадр */
    function screenToWorld(px, py) {
      const halfH = TAN * camZ
      const halfW = halfH * aspect
      return {
        x: ((px / innerWidth) * 2 - 1) * halfW,
        y: targetY + (-(py / innerHeight) * 2 + 1) * halfH,
      }
    }

    /* элемент ищется каждый раз, а не берётся заранее: measureSlot зовётся из resize,
       который отрабатывает раньше этой секции */
    function measureSlot() {
      const img = document.querySelector('.shelf img')
      if (!img) return
      const r = img.getBoundingClientRect()
      const w = screenToWorld(r.left + r.width * SLOT.x, r.top + r.height * SLOT.y)
      slotWorld.x = w.x
      slotWorld.y = w.y
    }

    function finishEnter() {
      introK = 1; introX = 0; introY = 0
      mode = 'fan'
      document.body.classList.remove('intro', 'entering')
      const el = document.getElementById('shelf')
      if (el) el.style.display = 'none'
    }

    function enterFromShelf() {
      if (mode !== 'intro') return
      measureSlot()
      fanRoot.visible = true
      document.body.classList.add('entering')
      mode = 'entering'
      t0 = performance.now()
      /* точки проявляются, когда веер уже разошёлся, а не в момент клика */
      setTimeout(() => document.body.classList.remove('intro'), ENTER * 0.55)
      if (reduced) finishEnter()
    }

    {
      const shelf = document.getElementById('shelf')
      const img = shelf.querySelector('img')
      const reveal = () => requestAnimationFrame(() => document.body.classList.add('ready'))

      shelf.addEventListener('click', enterFromShelf)

      if (img.complete && img.naturalWidth) reveal()
      else img.addEventListener('load', reveal, { once: true })

      /* если картинка не загрузилась, запирать посетителя на пустом экране нельзя */
      img.addEventListener('error', () => {
        document.body.classList.add('ready')
        fanRoot.visible = true
        finishEnter()
      }, { once: true })
    }

    function frame(now) {
      requestAnimationFrame(frame)
      const dt = Math.min((now - last) / 1000, 0.05)
      last = now

      if (mode === 'entering') {
        const t = Math.min((now - t0) / ENTER, 1)
        const e = easeOut(t)
        introK = ENTER_SEED + (1 - ENTER_SEED) * e
        introX = slotWorld.x * (1 - e)
        introY = slotWorld.y * (1 - e)
        if (t >= 1) finishEnter()
      } else if (mode === 'opening') {
        const t = Math.min((now - t0) / FLY, 1)
        cardT = t
        hero.recOut = easeOut(Math.min(Math.max((now - t0 - REC_DELAY) / REC_TIME, 0), 1))
        applyHero(t)
        if (t >= 1) mode = 'card'
      } else if (mode === 'card') {
        hero.recOut = 1
        applyHero(1)
      } else if (mode === 'closing') {
        const t = Math.min((now - t0) / FLY, 1)
        cardT = 1 - t
        hero.recOut = 1 - easeOut(t)
        applyHero(1 - t)
        if (t >= 1) finishClose()
      }

      layout(dt)          /* смена текстур — до отрисовки, иначе обложки моргают на границе шага */
      applyCamera()

      camera.aspect = aspect
      camera.updateProjectionMatrix()
      renderer.render(scene, camera)
    }
    /* цикл запускается в самом конце модуля: layout() трогает разметку,
       и до её сборки ни одного кадра пройти не должно */

    /* ============================================================
       размеры
       ============================================================ */

    function resize() {
      readViewport()
      const w = canvas.clientWidth || innerWidth
      const h = canvas.clientHeight || innerHeight
      renderer.setSize(w, h, false)
      camera.aspect = aspect
      camera.updateProjectionMatrix()

      /* крупный план считается от размеров кадра: при повороте экрана или смене окна
         его надо пересчитать, иначе обложка остаётся в позиции прежнего кадра */
      if (mode === 'card' || mode === 'opening') {
        const p = cardPlacement()
        heroTo.pos.set(p.x, p.y, 0)
        if (mode === 'card') applyHero(1)
      }

      /* точка выхода веера считается от экранного положения полки */
      if (mode === 'entering') measureSlot()

      if (lbOn) lbPlace()
    }
    new ResizeObserver(resize).observe(document.documentElement)
    addEventListener('resize', resize)
    resize()

    /* ============================================================
       ввод
       ============================================================ */

    const ray = new THREE.Raycaster()
    const ptr = new THREE.Vector2()
    const proxies = slots.map(s => s.proxy)

    function pxPerStep() {
      const pxPerCm = innerHeight / (2 * TAN * camZ)
      return ARC_R * STEP * pxPerCm
    }

    function pick(ev) {
      ptr.x = (ev.clientX / innerWidth) * 2 - 1
      ptr.y = -(ev.clientY / innerHeight) * 2 + 1
      ray.setFromCamera(ptr, camera)
      const hit = ray.intersectObjects(proxies, false)[0]
      return hit ? hit.object.userData.slot : -1
    }

    /* Слушатель на окне, а не на канвасе: под курсором может оказаться шапка, точки
       или любой другой слой поверх сцены, и прокрутка не должна от этого пропадать.
       На витрине странице всё равно нечего прокручивать, кроме веера. */
    addEventListener('wheel', ev => {
      if (mode !== 'fan') return
      ev.preventDefault()
      scrollTarget += ev.deltaY / 100          /* одна «щелчка» — примерно один конверт */
    }, { passive: false })

    let dragging = false, dragId = null, dragX = 0, moved = 0, startScroll = 0, downAt = 0

    canvas.addEventListener('pointerdown', ev => {
      if (mode !== 'fan') return
      dragging = true; dragId = ev.pointerId
      dragX = ev.clientX; moved = 0; startScroll = scrollTarget; downAt = performance.now()
      canvas.setPointerCapture(dragId)
      canvas.classList.add('dragging')
    })

    canvas.addEventListener('pointermove', ev => {
      if (mode === 'card') {
        /* без подсказки курсором никто не догадается, что обложка кликабельна */
        ray.setFromCamera(
          new THREE.Vector2((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1),
          camera)
        canvas.classList.toggle('over-cover', !lbOn && !!ray.intersectObject(hero.s.mesh, true).length)
        return
      }
      canvas.classList.remove('over-cover')
      if (mode !== 'fan') return

      if (dragging) {
        const dx = ev.clientX - dragX
        moved = Math.max(moved, Math.abs(dx))
        scrollTarget = startScroll - dx / pxPerStep()
        return
      }

      const i = pick(ev)
      for (const sl of slots) sl.hover = (sl.i === i)
      canvas.classList.toggle('over-sleeve', i >= 0)
    })

    function endDrag(ev) {
      if (!dragging) return
      dragging = false
      canvas.classList.remove('dragging')
      try { canvas.releasePointerCapture(dragId) } catch { }

      /* клик засчитывается только без протяжки */
      if (moved < 5 && performance.now() - downAt < 400) {
        const i = pick(ev)
        if (i >= 0) openCard(i)
      }
    }
    canvas.addEventListener('pointerup', endDrag)
    canvas.addEventListener('pointercancel', () => { dragging = false; canvas.classList.remove('dragging') })

    canvas.addEventListener('pointerleave', () => {
      for (const sl of slots) sl.hover = false
      canvas.classList.remove('over-sleeve')
    })

    /* по обложке — раскрыть её во весь экран, мимо — закрыть карточку */
    canvas.addEventListener('click', ev => {
      if (mode !== 'card' || lbOn) return
      ray.setFromCamera(
        new THREE.Vector2((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1),
        camera)
      if (ray.intersectObject(hero.s.mesh, true).length) openLightbox()
      else closeCard()
    })

    addEventListener('keydown', ev => {
      if (ev.key === 'Escape') {
        /* сначала закрывается то, что открыто последним */
        if (lbOn) { closeLightbox(); return }
        if (mode === 'card' || mode === 'opening') closeCard()
      }
      if (mode !== 'fan') return
      if (ev.key === 'ArrowRight') { scrollTarget = Math.round(scrollTarget) + 1; ev.preventDefault() }
      if (ev.key === 'ArrowLeft') { scrollTarget = Math.round(scrollTarget) - 1; ev.preventDefault() }
    })

    document.getElementById('c-back').addEventListener('click', closeCard)

    /* ============================================================
       разметка
       ============================================================ */

    document.getElementById('h-note').textContent = COPY.note
    document.getElementById('h-brand').textContent = COPY.brand
    for (const id of ['h-sign', 'c-listen']) {
      const a = document.getElementById(id)
      a.textContent = COPY.sign
      a.href = COPY.signHref
    }

    function goTo(j) {
      const cur = Math.round(scroll)
      let d = ((j - ((cur % N) + N) % N) % N + N) % N
      if (d > N / 2) d -= N
      scrollTarget = cur + d
    }

    const dots = document.getElementById('dots')
    RELEASES.forEach((r, j) => {
      const a = document.createElement('a')
      a.href = `#release-${j + 1}`
      a.dataset.i = j
      a.setAttribute('aria-label', `${r.title} — ${r.artist}`)
      a.addEventListener('click', ev => { ev.preventDefault(); goTo(j) })
      a.addEventListener('focus', () => { if (mode === 'fan') goTo(j) })   /* фокус доводит карусель */
      dots.appendChild(a)
    })

    /* каталог для скринридера — канвас для него пуст */
    document.getElementById('catalog').innerHTML = RELEASES.map((r, j) => `
  <article id="release-${j + 1}">
    <h2>${esc(r.title)}</h2>
    <p>${esc(r.artist)}</p>
    <p>${esc(r.description)}</p>
    ${r.text ? `<p>${esc(r.text)}</p>` : ''}
  </article>`).join('')

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

    function announce() {
      for (const a of dots.children) a.setAttribute('aria-current', String(+a.dataset.i === active))
      const r = RELEASES[active]
      document.getElementById('live').textContent = `${active + 1} of ${N}. ${r.title}, ${r.artist}.`
    }
    announce()

    function fillCard(rel) {
      const r = RELEASES[rel]
      document.getElementById('c-title').textContent = r.title
      document.getElementById('c-artist').textContent = r.artist
      document.getElementById('c-desc').textContent = r.description
      const text = document.getElementById('c-text')
      text.textContent = r.text
      text.scrollTop = 0
      document.querySelector('.card-cols').scrollTop = 0   // шторка всегда открывается с заголовка
    }

    /* ============================================================
       запасная сетка — с настоящей причиной
       ============================================================ */

    function showFallback(why) {
      const el = document.getElementById('fallback')
      if (el.classList.contains('on')) return
      el.classList.add('on')

      document.getElementById('fb-why').innerHTML =
        why === 'covers'
          ? (location.protocol === 'file:'
            ? 'Обложки не загрузились: страница открыта как локальный файл, и браузер не даёт ей читать соседнюю папку. Запустите <code>python3 -m http.server 8000</code> в папке со страницей и откройте <code>http://localhost:8000</code>.'
            : 'Обложки не загрузились: файлы <code>covers/1.jpg … covers/' + N + '.jpg</code> не найдены. WebGL при этом работает.')
          : 'Сцена не запустилась: браузер не отдал контекст WebGL. Обложки ниже — вся коллекция в обычной сетке.'

      document.getElementById('fb-grid').innerHTML = RELEASES.map((r, j) => `
    <figure>
      <img src="covers/${j + 1}.jpg" alt="${esc(r.title)}">
      <figcaption class="mono">${esc(r.title)}</figcaption>
    </figure>`).join('')
    }

    /* всё собрано — можно крутить */
    requestAnimationFrame(frame)
  </script>
</body>

</html>
